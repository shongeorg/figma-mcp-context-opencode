          <!-- Panels -->
          <div class="account-panel">
            <section class="address-block" aria-labelledby="billing-title">
              <div class="section-head">
                <h2 id="billing-title">Billing Address</h2>
                <a class="add-link" href="#billing-title">Add</a>
              </div>
              <p class="account-panel__lead">
                The following addresses will be used on the checkout page by default.
              </p>

              <form data-demo="Your address has been saved." novalidate>
                <div class="form-grid">
                  <p class="field">
                    <label class="field__label" for="bill-first"
                      >First Name <span class="req">*</span></label
                    >
                    <input class="input" id="bill-first" name="firstName" type="text" autocomplete="given-name" required />
                  </p>
                  <p class="field">
                    <label class="field__label" for="bill-last"
                      >Last Name <span class="req">*</span></label
                    >
                    <input class="input" id="bill-last" name="lastName" type="text" autocomplete="family-name" required />
                  </p>

                  <p class="field">
                    <label class="field__label" for="bill-country"
                      >Country / Region <span class="req">*</span></label
                    >
                    <select class="select" id="bill-country" name="country" autocomplete="country-name" required>
                      <option value="">Select a country / region</option>
                      <option value="us">United States (USA)</option>
                      <option value="ca">Canada</option>
                      <option value="uk">United Kingdom</option>
                      <option value="de">Germany</option>
                      <option value="au">Australia</option>
                    </select>
                  </p>
                  <p class="field">
                    <label class="field__label" for="bill-city"
                      >Town / City <span class="req">*</span></label
                    >
                    <input class="input" id="bill-city" name="city" type="text" autocomplete="address-level2" required />
                  </p>

                  <p class="field">
                    <label class="field__label" for="bill-street"
                      >Street Address <span class="req">*</span></label
                    >
                    <input
                      class="input"
                      id="bill-street"
                      name="street"
                      type="text"
                      placeholder="House number and street name"
                      autocomplete="address-line1"
                      required
                    />
                  </p>
                  <p class="field">
                    <label class="field__label" for="bill-street2">
                      <span class="visually-hidden"
                        >Apartment, suite, unit, etc. (optional)</span
                      >
                    </label>
                    <input
                      class="input"
                      id="bill-street2"
                      name="street2"
                      type="text"
                      placeholder="Appartment, suite, unit, etc. (optional)"
                      autocomplete="address-line2"
                    />
                  </p>

                  <p class="field">
                    <label class="field__label" for="bill-state"
                      >State <span class="req">*</span></label
                    >
                    <select class="select" id="bill-state" name="state" autocomplete="address-level1" required>
                      <option value="">Select a state</option>
                      <option value="ny">New York</option>
                      <option value="ca">California</option>
                      <option value="tx">Texas</option>
                      <option value="fl">Florida</option>
                    </select>
                  </p>
                  <p class="field">
                    <label class="field__label" for="bill-zip"
                      >Zip <span class="req">*</span></label
                    >
                    <input class="input" id="bill-zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" required />
                  </p>

                  <p class="field">
                    <label class="field__label" for="bill-email"
                      >Email address <span class="req">*</span></label
                    >
                    <input class="input" id="bill-email" name="email" type="email" autocomplete="email" required />
                  </p>
                  <p class="field">
                    <label class="field__label" for="bill-phone"
                      >Phone Number <span class="req">*</span></label
                    >
                    <span class="phone-field">
                      <select class="select" id="bill-phone-prefix" name="phonePrefix" aria-label="Country calling code">
                        <option value="+966">+966</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                        <option value="+49">+49</option>
                      </select>
                      <input
                        class="input"
                        id="bill-phone"
                        name="phone"
                        type="tel"
                        placeholder="Your phone number"
                        autocomplete="tel-national"
                        required
                      />
                    </span>
                  </p>
                </div>

                <button class="btn btn--primary" type="submit">Save Address</button>
                <p class="form-status" data-status role="status"></p>
              </form>
            </section>

            <section class="address-block" aria-labelledby="shipping-title">
              <div class="section-head">
                <h2 id="shipping-title">Shipping Address</h2>
                <span class="section-head__actions">
                  <label class="radio">
                    <input type="radio" name="shippingSame" value="same" />
                    Same as billing address
                  </label>
                  <a class="add-link" href="#shipping-title">Add</a>
                </span>
              </div>
              <p class="account-panel__lead">
                You have not set up this type of address yet.
              </p>
            </section>
          </div>
