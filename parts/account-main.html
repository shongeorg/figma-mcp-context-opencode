          <!-- Panel -->
          <div class="account-panel">
            <h2>Personal Information</h2>

            <form data-demo="Your account details have been updated." novalidate>
              <div class="form-grid">
                <p class="field">
                  <label class="field__label" for="acc-first"
                    >First Name <span class="req">*</span></label
                  >
                  <input class="input" id="acc-first" name="firstName" type="text" autocomplete="given-name" required />
                </p>
                <p class="field">
                  <label class="field__label" for="acc-last"
                    >Last Name <span class="req">*</span></label
                  >
                  <input class="input" id="acc-last" name="lastName" type="text" autocomplete="family-name" required />
                </p>

                <p class="field">
                  <label class="field__label" for="acc-email"
                    >Email address <span class="req">*</span></label
                  >
                  <input class="input" id="acc-email" name="email" type="email" autocomplete="email" required />
                </p>
                <p class="field">
                  <label class="field__label" for="acc-phone"
                    >Phone Number <span class="req">*</span></label
                  >
                  <span class="phone-field">
                    <select class="select" id="acc-phone-prefix" name="phonePrefix" aria-label="Country calling code">
                      <option value="+966">+966</option>
                      <option value="+1">+1</option>
                      <option value="+44">+44</option>
                      <option value="+49">+49</option>
                    </select>
                    <input
                      class="input"
                      id="acc-phone"
                      name="phone"
                      type="tel"
                      placeholder="Your phone number"
                      autocomplete="tel-national"
                      required
                    />
                  </span>
                </p>

                <p class="field">
                  <label class="field__label" for="acc-user"
                    >Username <span class="req">*</span></label
                  >
                  <input class="input" id="acc-user" name="username" type="text" autocomplete="username" required />
                </p>
                <p class="field">
                  <label class="field__label" for="acc-photo">Photo</label>
                  <span class="photo-row">
                    <span class="photo-row__avatar" aria-hidden="true">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="4.4" width="17.2" height="15.2" rx="3" /><circle cx="9" cy="10" r="1.8" /><path d="M4.6 18.2a5 5 0 0 1 8.8-2.6" /></svg>
                    </span>
                    <label class="btn btn--primary" for="acc-photo">Change</label>
                    <input
                      class="visually-hidden"
                      id="acc-photo"
                      name="photo"
                      type="file"
                      accept="image/png,image/jpeg,image/webp"
                    />
                    <button class="photo-row__remove" type="button">Remove</button>
                  </span>
                </p>
              </div>

              <h3 class="group-title">Password change</h3>

              <div class="stack">
                <p class="field">
                  <label class="field__label" for="acc-pass">Current password</label>
                  <span class="input-wrap">
                    <input
                      class="input"
                      id="acc-pass"
                      name="currentPassword"
                      type="password"
                      autocomplete="current-password"
                    />
                    <button
                      class="input-wrap__toggle"
                      type="button"
                      data-toggle-password="acc-pass"
                      aria-label="Show password"
                      aria-pressed="false"
                    >
                      <img src="assets/images/icons/icon-eye-off.svg" width="20" height="20" alt="" />
                    </button>
                  </span>
                </p>

                <p class="field">
                  <label class="field__label" for="acc-pass-new">New password</label>
                  <span class="input-wrap">
                    <input
                      class="input"
                      id="acc-pass-new"
                      name="newPassword"
                      type="password"
                      autocomplete="new-password"
                    />
                    <button
                      class="input-wrap__toggle"
                      type="button"
                      data-toggle-password="acc-pass-new"
                      aria-label="Show password"
                      aria-pressed="false"
                    >
                      <img src="assets/images/icons/icon-eye-off.svg" width="20" height="20" alt="" />
                    </button>
                  </span>
                </p>

                <p class="field">
                  <label class="field__label" for="acc-pass-confirm"
                    >Confirm new password</label
                  >
                  <span class="input-wrap">
                    <input
                      class="input"
                      id="acc-pass-confirm"
                      name="confirmPassword"
                      type="password"
                      autocomplete="new-password"
                    />
                    <button
                      class="input-wrap__toggle"
                      type="button"
                      data-toggle-password="acc-pass-confirm"
                      aria-label="Show password"
                      aria-pressed="false"
                    >
                      <img src="assets/images/icons/icon-eye-off.svg" width="20" height="20" alt="" />
                    </button>
                  </span>
                </p>
              </div>

              <button class="btn btn--primary" type="submit">Save Change</button>
              <p class="form-status" data-status role="status"></p>
            </form>
          </div>
        </div>
